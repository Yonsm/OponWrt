# ==============================================================================
# 设备构建矩阵解析函数: resolve_target_config <PRESET_NAME>
# 支持预设示例:
#   X64, X64+DOCKER+WIFI, CM520, CM520+DOCKER, K2P, K2P+USB, C5, NEWIFI3, Y1, RMAX6000, RMAX6000+STOCK
# 输出变量:
#   TARGET_BOARD, TARGET_SUBTARGET, TARGET_PROFILE, PKG_ARCH, ROOTFS_PARTSIZE, FINAL_PACKAGES
# ==============================================================================
resolve_target_config() {
	local PRESET="${1:-X64+DOCKER+WIFI}"
	local USB=1
	local SMB="KSMBD"
	local EXTRA_PKGS=""
	ROOTFS_PARTSIZE=""

	case "$PRESET" in
	X64*)
		TARGET_BOARD="x86"
		TARGET_SUBTARGET="64"
		TARGET_PROFILE="generic"
		PKG_ARCH="x86_64"
		ROOTFS_PARTSIZE="400"
		SMB="SMB4"
		EXTRA_PKGS="$X64_BASE_PACKAGES"
		;;
	CM520*)
		TARGET_BOARD="ipq40xx"
		TARGET_SUBTARGET="generic"
		TARGET_PROFILE="mobipromo_cm520-79f"
		PKG_ARCH="arm_cortex-a7_neon-vfpv4"
		;;
	K2P*)
		TARGET_BOARD="ramips"
		TARGET_SUBTARGET="mt7621"
		TARGET_PROFILE="phicomm_k2p"
		PKG_ARCH="mipsel_24kc"
		[[ "$PRESET" != *"+USB"* ]] && USB=0
		;;
	C5*)
		TARGET_BOARD="ramips"
		TARGET_SUBTARGET="mt7621"
		TARGET_PROFILE="xiaoyu_xy-c5"
		PKG_ARCH="mipsel_24kc"
		;;
	NEWIFI3*)
		TARGET_BOARD="ramips"
		TARGET_SUBTARGET="mt7621"
		TARGET_PROFILE="d-team_newifi-d2"
		PKG_ARCH="mipsel_24kc"
		;;
	Y1*)
		TARGET_BOARD="ramips"
		TARGET_SUBTARGET="mt7620"
		TARGET_PROFILE="lenovo_newifi-y1"
		PKG_ARCH="mipsel_24kc"
		EXTRA_PKGS="$Y1_EXTRA_PACKAGES"
		;;
	RMAX6000*)
		TARGET_BOARD="mediatek"
		TARGET_SUBTARGET="filogic"
		if [[ "$PRESET" == *"+STOCK"* ]]; then
			TARGET_PROFILE="xiaomi_redmi-router-ax6000-stock"
		else
			TARGET_PROFILE="xiaomi_redmi-router-ax6000"
		fi
		PKG_ARCH="aarch64_cortex-a53"
		USB=0
		;;
	*)
		echo "Unknown preset: $PRESET" >&2
		return 1
		;;
	esac

	[[ "$PRESET" == *"+SMB4"* ]] && SMB="SMB4"
	[[ "$PRESET" == *"+USB"* ]] && USB=1

	FINAL_PACKAGES="$COMMON_BASE_PACKAGES $COMMON_LUCI_PACKAGES $EXTRA_PKGS"

	if [[ "$PRESET" != *"+NOWING"* ]]; then
		FINAL_PACKAGES="$FINAL_PACKAGES $WING_PACKAGES"
	fi

	if [ "$USB" -eq 1 ]; then
		FINAL_PACKAGES="$FINAL_PACKAGES $USB_STORAGE_PACKAGES"
		if [ "$TARGET_PROFILE" != "lenovo_newifi-y1" ]; then
			FINAL_PACKAGES="$FINAL_PACKAGES $USB_DOWNLOAD_PACKAGES"
		fi
	fi

	if [ "$SMB" = "SMB4" ]; then
		FINAL_PACKAGES="$FINAL_PACKAGES $SMB4_PACKAGES"
	else
		FINAL_PACKAGES="$FINAL_PACKAGES $KSMBD_PACKAGES"
	fi

	if [[ "$PRESET" == *"+HASS"* ]]; then
		FINAL_PACKAGES="$FINAL_PACKAGES $HASS_PACKAGES"
	fi

	if [[ "$PRESET" == *"+DOCKER"* ]]; then
		FINAL_PACKAGES="$FINAL_PACKAGES $DOCKER_PACKAGES"
		[ "$TARGET_BOARD" = "x86" ] && FINAL_PACKAGES="$FINAL_PACKAGES $DOCKER_X64_PACKAGES"
	fi

	if [ "$TARGET_BOARD" = "x86" ] && [[ "$PRESET" == *"+WIFI"* ]]; then
		FINAL_PACKAGES="$FINAL_PACKAGES $X64_WIFI_PACKAGES"
	fi

	# 规范化为空格分隔的单行包名清单
	FINAL_PACKAGES="$(echo $FINAL_PACKAGES | tr '\n' ' ' | sed 's/  */ /g; s/^ //; s/ $//')"
}
