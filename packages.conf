"

# 解析预设名称并输出 TARGET_BOARD / TARGET_SUBTARGET / TARGET_PROFILE / PKG_ARCH / ROOTFS_PARTSIZE / FINAL_PACKAGES
resolve_target_config() {
	local PRESET="$1"
	local USB=0 SMB="" EXTRA_PKGS=""
	ROOTFS_PARTSIZE=""

	case "$TARGET_PROFILE" in
	generic) if [ "$TARGET_BOARD/$TARGET_SUBTARGET" = x86/64 ]; then USB=1; ROOTFS_PARTSIZE="400"; SMB="SMB4"; EXTRA_PKGS="$X64_BASE_PACKAGES"; fi ;;
	mobipromo_cm520-79f|xiaoyu_xy-c5|d-team_newifi-d2) USB=1; SMB="KSMBD" ;;
	lenovo_newifi-y1) USB=1; SMB="KSMBD"; EXTRA_PKGS="$Y1_EXTRA_PACKAGES" ;;
	phicomm_k2p|xiaomi_redmi-router-ax6000-stock|xiaomi_redmi-router-ax6000-ubootmod) SMB="KSMBD" ;;
	esac

	[[ "$PRESET" == *"+SMB4"* ]] && SMB="SMB4"
	[[ "$PRESET" == *"+USB"* ]] && USB=1

	FINAL_PACKAGES="$COMMON_BASE_PACKAGES $COMMON_LUCI_PACKAGES $EXTRA_PKGS"
	[[ "$PRESET" != *"+NOWING"* ]] && FINAL_PACKAGES="$FINAL_PACKAGES $WING_PACKAGES"
	if [ "$USB" -eq 1 ]; then
		FINAL_PACKAGES="$FINAL_PACKAGES $USB_STORAGE_PACKAGES"
		[ "$TARGET_PROFILE" != "lenovo_newifi-y1" ] && FINAL_PACKAGES="$FINAL_PACKAGES $USB_DOWNLOAD_PACKAGES"
	fi
	[ "$SMB" = "SMB4" ] && FINAL_PACKAGES="$FINAL_PACKAGES $SMB4_PACKAGES"
	[ "$SMB" = "KSMBD" ] && FINAL_PACKAGES="$FINAL_PACKAGES $KSMBD_PACKAGES"
	[[ "$PRESET" == *"+HASS"* ]] && FINAL_PACKAGES="$FINAL_PACKAGES $HASS_PACKAGES"
	if [[ "$PRESET" == *"+DOCKER"* ]]; then
		FINAL_PACKAGES="$FINAL_PACKAGES $DOCKER_PACKAGES"
		[ "$TARGET_BOARD" = "x86" ] && FINAL_PACKAGES="$FINAL_PACKAGES $DOCKER_X64_PACKAGES"
	fi
	[ "$TARGET_BOARD" = "x86" ] && [[ "$PRESET" == *"+WIFI"* ]] && FINAL_PACKAGES="$FINAL_PACKAGES $X64_WIFI_PACKAGES"

	FINAL_PACKAGES="$(echo $FINAL_PACKAGES | tr '\n' ' ' | sed 's/  */ /g; s/^ //; s/ $//')"
}
