	kmod-mt7603
	kmod-mt76x0e
"

# 解析预设名称并输出 TARGET_BOARD / TARGET_SUBTARGET / TARGET_PROFILE / PKG_ARCH / ROOTFS_PARTSIZE / FINAL_PACKAGES
resolve_target_config() {
	local PRESET="${1:-X64+DOCKER+WIFI}"
	local USB=1 SMB="KSMBD" EXTRA_PKGS=""
	ROOTFS_PARTSIZE=""

	case "$PRESET" in
	X64*)
		TARGET_BOARD="x86"; TARGET_SUBTARGET="64"; TARGET_PROFILE="generic"; PKG_ARCH="x86_64"
		ROOTFS_PARTSIZE="400"; SMB="SMB4"; EXTRA_PKGS="$X64_BASE_PACKAGES" ;;
	CM520*)
		TARGET_BOARD="ipq40xx"; TARGET_SUBTARGET="generic"; TARGET_PROFILE="mobipromo_cm520-79f"; PKG_ARCH="arm_cortex-a7_neon-vfpv4" ;;
	K2P*)
		TARGET_BOARD="ramips"; TARGET_SUBTARGET="mt7621"; TARGET_PROFILE="phicomm_k2p"; PKG_ARCH="mipsel_24kc"
		[[ "$PRESET" != *"+USB"* ]] && USB=0 ;;
	C5*)
		TARGET_BOARD="ramips"; TARGET_SUBTARGET="mt7621"; TARGET_PROFILE="xiaoyu_xy-c5"; PKG_ARCH="mipsel_24kc" ;;
	NEWIFI3*)
		TARGET_BOARD="ramips"; TARGET_SUBTARGET="mt7621"; TARGET_PROFILE="d-team_newifi-d2"; PKG_ARCH="mipsel_24kc" ;;
	Y1*)
		TARGET_BOARD="ramips"; TARGET_SUBTARGET="mt7620"; TARGET_PROFILE="lenovo_newifi-y1"; PKG_ARCH="mipsel_24kc"
		EXTRA_PKGS="$Y1_EXTRA_PACKAGES" ;;
	RMAX6000*)
		TARGET_BOARD="mediatek"; TARGET_SUBTARGET="filogic"; PKG_ARCH="aarch64_cortex-a53"; USB=0
		[[ "$PRESET" == *"+STOCK"* ]] && TARGET_PROFILE="xiaomi_redmi-router-ax6000-stock" || TARGET_PROFILE="xiaomi_redmi-router-ax6000" ;;
	*)
		echo "Unknown preset: $PRESET" >&2; return 1 ;;
	esac

	[[ "$PRESET" == *"+SMB4"* ]] && SMB="SMB4"
	[[ "$PRESET" == *"+USB"* ]] && USB=1

	FINAL_PACKAGES="$COMMON_BASE_PACKAGES $COMMON_LUCI_PACKAGES $EXTRA_PKGS"
	[[ "$PRESET" != *"+NOWING"* ]] && FINAL_PACKAGES="$FINAL_PACKAGES $WING_PACKAGES"
	if [ "$USB" -eq 1 ]; then
		FINAL_PACKAGES="$FINAL_PACKAGES $USB_STORAGE_PACKAGES"
		[ "$TARGET_PROFILE" != "lenovo_newifi-y1" ] && FINAL_PACKAGES="$FINAL_PACKAGES $USB_DOWNLOAD_PACKAGES"
	fi
	[ "$SMB" = "SMB4" ] && FINAL_PACKAGES="$FINAL_PACKAGES $SMB4_PACKAGES" || FINAL_PACKAGES="$FINAL_PACKAGES $KSMBD_PACKAGES"
	[[ "$PRESET" == *"+HASS"* ]] && FINAL_PACKAGES="$FINAL_PACKAGES $HASS_PACKAGES"
	if [[ "$PRESET" == *"+DOCKER"* ]]; then
		FINAL_PACKAGES="$FINAL_PACKAGES $DOCKER_PACKAGES"
		[ "$TARGET_BOARD" = "x86" ] && FINAL_PACKAGES="$FINAL_PACKAGES $DOCKER_X64_PACKAGES"
	fi
	[ "$TARGET_BOARD" = "x86" ] && [[ "$PRESET" == *"+WIFI"* ]] && FINAL_PACKAGES="$FINAL_PACKAGES $X64_WIFI_PACKAGES"

	FINAL_PACKAGES="$(echo $FINAL_PACKAGES | tr '\n' ' ' | sed 's/  */ /g; s/^ //; s/ $//')"
}
