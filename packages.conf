# ==============================================================================
# OpenWrt ImageBuilder 精简软件包与设备配置清单 (packages.conf)
# 由原 4-fix、5-menu、config/* 及 wing/Makefile 提炼生成（已彻底剔除 N1 盒子定制）
# 兼容最新 OpenWrt Release 版 (apk / opkg) 包管理机制
# ==============================================================================

